apiVersion: batch/v1
kind: Job
metadata:
  name: check-secret-exists
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: check-secret
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          # Get the namespace from the service account
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          SECRET_NAME='my-secret'
          echo "Checking for secret '${SECRET_NAME}' in namespace ${NAMESPACE}"
          
          # Check if the secret exists
          if kubectl get secret "${SECRET_NAME}" -n ${NAMESPACE} &> /dev/null; then
            echo "Secret '${SECRET_NAME}' found in namespace $NAMESPACE"
            exit 0
          else
            echo "Secret '${SECRET_NAME}' not found in namespace $NAMESPACE"
            exit 1
          fi
      serviceAccountName: argocd-hook-sa  # Make sure this service account exists with proper permissions
      restartPolicy: Never
  backoffLimit: 0
